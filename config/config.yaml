# Configuration for the anomalies-at-scale Snakemake workflow.

# Name of the dataset this run is for; picks the output paths.
dataset: cmapss_fd001

# Where the raw data comes from and how to read it.
raw:
  # URLs for the anomaly-free corpus data; empty means it is already on disk.
  corpus_urls: []
  # URLs for the data to be scored; empty means it is already on disk.
  test_urls: []
  # Which value channels to keep; null keeps all of them.
  value_column: null
  # Column used as the signature's time channel, by position.
  time_column: 1

# Transformations applied before signatures are taken.
preprocess:
  # Delay-embedding depth; 0 disables it.
  lag: 0
  # How a channel is paired with its past: delay or difference.
  lag_method: delay

# How the corpus series is divided into fitting and calibration halves.
split:
  # Fraction of the corpus series held out as normal reference data.
  base_fraction: 0.572

# Channel reduction with UMAP, applied before signatures.
umap:
  # Latent dimension; -1 disables the reduction.
  dimension: -1
  # Points of history included in each row handed to UMAP.
  context: 1
  # Stride between rows used to fit the embedding; null uses every row.
  fit_stride: null
  # UMAP neighbourhood size for the embedding.
  n_neighbors: 15
  # UMAP minimum distance; smaller packs the embedding more tightly.
  min_dist: 0.1
  # Neighbours the regressor averages over when placing an unseen point.
  knn_neighbours: 10
  # Standardise channels before embedding.
  standardise: true
  # Seed for the embedding.
  random_state: 0

# Optional windowing of streams before scoring.
window:
  # Increments per window; 0 or less scores whole streams instead.
  size: 16

# Path-signature computation.
signature:
  # Put signature components on a comparable scale before fitting the metric.
  normalise: true
  # Which normalisation: zscore, scale, maxabs or factorial.
  normalise_method: factorial
  # Signature truncation level.
  trunc: 2
  # Finest dyadic interval, as a relative width of 2**-granularity.
  granularity: 3
  # Column identifying which stream a row belongs to, by position.
  stream_column: 0
  # Format the corpus is written in: parquet or csv.
  format: parquet

# Optional reduction of signature space, after signatures are taken.
signature_umap:
  # Latent dimension; -1 disables the reduction.
  dimension: -1
  # UMAP neighbourhood size for the signature embedding.
  n_neighbors: 15
  # UMAP minimum distance for the signature embedding.
  min_dist: 0.1
  # Neighbours the regressor averages over when placing a new signature.
  knn_neighbours: 10
  # Cap on intervals used to fit the embedding.
  fit_rows: 50000
  # Seed for the signature embedding.
  random_state: 0

# The Mahalanobis metric fitted to the corpus signatures.
metric:
  # Keep the leading components carrying this share of signature variance.
  variance_keep: 0.999
  # Relative singular floor; directions below rcond * s_max are dropped.
  rcond: 1.0e-8
  # Which matrix the covariance stage writes: inv_sqrt or cov.
  form: inv_sqrt
  # How that matrix is stored on disk.
  file_format: npz
  # Keep the rank-r factor and index in latent coordinates rather than the full matrix.
  factored: true

# How the detection thresholds are set.
calibrate:
  # Cross-validation folds, split over streams rather than intervals.
  folds: 5
  # How a width's calibration distances become its threshold: max, median or pNN.
  statistic: p95
  # Seed for the fold assignment.
  random_state: 0

# The detector itself.
detect:
  # What is asked of each candidate interval: mahalanobis or forest.
  method: mahalanobis
  # Which neighbour's distance is the score: 1 the nearest, n the n-th.
  neighbours: 3
  # Feature bagging over random channel subsets.
  bagged:
    # Number of draws to combine; -1 disables bagging.
    draws: -1
    # Channels per draw; null picks a default from the channel count.
    features: null
    # Draws that must agree before a point is flagged.
    votes: 1
    # Seed for the channel draws.
    random_state: 0
  # Isolation-forest detector, used when method is forest.
  forest:
    # Coordinates the forest cuts on: whitened or raw.
    space: whitened
    # Trees in the forest.
    n_estimators: 200
    # Points per tree.
    max_samples: auto
  # How each depth band is structured for nearest-neighbour search.
  index:
    # Index type: exact, ivf or hnsw.
    type: exact
    # IVF cluster count; null derives one from the corpus size.
    nlist: null
    # IVF clusters searched per query.
    nprobe: 8
    # HNSW connections per node.
    hnsw_m: 32
    # HNSW build-time search width.
    ef_construction: 200
    # HNSW query-time search width.
    ef_search: 64
  # Where each interval's reference set and metric come from: pooled or per_interval.
  mode: pooled
  # Flag intervals lying this far off the fitted subspace; null disables the test.
  off_manifold: null
  # Depths either side of an interval's own that its reference set may draw from.
  band: 1
  # Resolution floor as a power of two: the narrowest interval the search will test.
  sig_tol: 2
  # Boundary extension step, as a power of two.
  tol: 0
  # Cap on searchable corpus intervals; null uses all of them.
  nn_reference_size: null
  # Seed for that subsampling.
  random_state: 0
  # Settings used only when mode is per_interval.
  per_interval:
    # Fitted metrics held in memory before older ones are discarded.
    cache_size: 2048

# Scoring the detector against ground truth, and the figures drawn.
evaluate:
  # Whether to score against ground truth at all.
  metrics: true
  # Ground-truth labels for the metrics; null draws plots only.
  labels: data/labels/cmapss_fd001_labels.parquet
  # A second pass giving every point a continuous score, for ROC-AUC and PR-AUC.
  point_scores:
    # Increments spanned by the sliding window.
    window: 8
    # Increments between window ends; 1 scores every point.
    stride: 1
  # Sweeping the threshold to trace a precision-recall curve.
  operating_points:
    # Multipliers applied to every calibrated per-depth threshold.
    scales: [0.5, 1.0, 2.0, 4.0]
  # Also draw streams with nothing flagged.
  plot_clean_streams: false
  # Cap on figures drawn, most severe first.
  max_plots: 25
  # Value channels drawn per stream.
  max_channels: 5
